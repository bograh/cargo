# Traefik v2/v3 dynamic configuration for an EXISTING host Traefik that
# should front a Cargo install in external-proxy mode. Cargo's Traefik
# listens on 127.0.0.1:8080 (HTTP) and 127.0.0.1:8443 (HTTPS).
#
# Replace cargo.example.com / apps.example.com with your domains.
# Load via your Traefik's file provider, e.g. in traefik.yml:
#   providers:
#     file:
#       directory: /etc/traefik/dynamic
#
# Recommended: TLS passthrough — your Traefik streams TLS to Cargo's
# without decrypting, so Cargo keeps managing its own certificates.

http:
  routers:
    cargo:
      entryPoints: [websecure]
      rule: "Host(`cargo.example.com`) || Host(`apps.example.com`) || HostRegexp(`{sub}.apps.example.com`)"
      service: cargo-traefik
      tls:
        passthrough: true

  services:
    cargo-traefik:
      loadBalancer:
        servers:
          - url: "https://127.0.0.1:8443"
