# nginx reverse-proxy config for a Cargo install running behind an
# existing nginx (external-proxy mode). Cargo's Traefik listens on
# 127.0.0.1:8080 (HTTP) and 127.0.0.1:8443 (HTTPS).
#
# Replace cargo.example.com / apps.example.com with your domains.
# Two options:
#
#   A) TLS passthrough (recommended): stream raw 443 traffic to Cargo so
#      it keeps managing its own Let's Encrypt certificates. Requires
#      nginx stream module (ngx_stream_module) and njs-free SNI routing:
#
#   # /etc/nginx/modules-enabled/cargo-stream.conf  (stream context)
#   stream {
#     map $ssl_preread_server_name $cargo_backend {
#       cargo.example.com     cargo_tls;
#       apps.example.com      cargo_tls;
#       ~^.+\.apps\.example\.com$ cargo_tls;
#     }
#     upstream cargo_tls { server 127.0.0.1:8443; }
#     server {
#       listen 443;
#       ssl_preread on;
#       proxy_pass $cargo_backend;
#     }
#   }
#
#   With option A you do NOT need the 443 server block below, but keep the
#   port-80 one so HTTP-01 challenges and plain HTTP reach Cargo.
#
#   B) Terminate TLS at nginx with your own certs (e.g. your wildcard for
#   *.apps.example.com) and proxy to Cargo's HTTPS or HTTP port:

server {
    listen 80;
    server_name cargo.example.com apps.example.com *.apps.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Websockets (app terminals, live logs):
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cargo.example.com apps.example.com *.apps.example.com;

    # Your certificates (a *.apps.example.com wildcard covers app subdomains).
    # ssl_certificate     /etc/ssl/cargo/fullchain.pem;
    # ssl_certificate_key /etc/ssl/cargo/privkey.pem;

    location / {
        # Forward to Cargo's Traefik. Use https://127.0.0.1:8443 to let
        # Cargo serve its own cert inside the tunnel, or http://127.0.0.1:8080
        # to forward plain HTTP after terminating at nginx:
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off; # Cargo's Traefik presents its own cert
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
