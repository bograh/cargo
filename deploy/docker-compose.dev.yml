services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: cargo
      POSTGRES_DB: cargo
    volumes:
      - cargo-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      # Mirror production: the DB is reachable only over cargo-system.
      - cargo-system

  controlplane:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      CARGO_DATABASE_URL: postgres://cargo:cargo@db:5432/cargo
      CARGO_MASTER_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      CARGO_HTTP_ADDR: ":8080"
      CARGO_DATA_DIR: /var/lib/cargo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cargo-dev-data:/var/lib/cargo
    ports:
      - "${CARGO_DEV_PORT:-8080}:8080"
    networks:
      # cargo-system reaches the DB; default keeps outbound internet (git
      # clone, image pull, nixpacks) since dev has no cargo-proxy at startup.
      - default
      - cargo-system

networks:
  cargo-system:
    internal: true

volumes:
  cargo-dev-db:
  cargo-dev-data:
