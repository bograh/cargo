# Cargo production stack — exactly three platform containers (NFR-3):
# Traefik (the only container publishing host ports), the controlplane,
# and Postgres. Configuration comes from a mode-0600 .env file next to
# this compose file (generated by install.sh in Phase 7).
#
# Required .env keys:
#   CARGO_PLATFORM_DOMAIN   e.g. cargo.example.com
#   CARGO_APPS_SUFFIX       e.g. apps.example.com
#   CARGO_ACME_EMAIL        Let's Encrypt account email
#   CARGO_MASTER_KEY        64 hex chars (back this up! env vars are unrecoverable without it)
#   CARGO_DB_PASSWORD       Postgres password
# Optional (wildcard DNS-01 mode):
#   CARGO_ACME_MODE=dns01   (default: http01)
#   CARGO_DNS_PROVIDER      Traefik provider name, e.g. cloudflare
#   plus the provider's own credential env vars (e.g. CF_DNS_API_TOKEN),
#   forwarded below via traefik's environment.

name: cargo

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=cargo-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # HTTP-01 resolver — always available; used for custom domains and,
      # in http01 mode (this file alone), for auto subdomains too.
      - --certificatesresolvers.le.acme.email=${CARGO_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Default cert for app routers (overridden by docker-compose.dns01.yml).
      - --entrypoints.websecure.http.tls.certresolver=le
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - cargo-acme:/acme
    networks:
      - cargo-proxy

  controlplane:
    image: ghcr.io/bograh/cargo:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CARGO_DATABASE_URL: postgres://cargo:${CARGO_DB_PASSWORD}@db:5432/cargo
      CARGO_MASTER_KEY: ${CARGO_MASTER_KEY}
      CARGO_HTTP_ADDR: ":8080"
      CARGO_DATA_DIR: /var/lib/cargo
      CARGO_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cargo-data:/var/lib/cargo
    networks:
      - cargo-proxy
    labels:
      # The platform UI is routed through Traefik like any app (dogfooded).
      - traefik.enable=true
      - traefik.http.routers.cargo.rule=Host(`${CARGO_PLATFORM_DOMAIN}`)
      - traefik.http.routers.cargo.entrypoints=websecure
      - traefik.http.routers.cargo.tls=true
      - traefik.http.routers.cargo.tls.certresolver=le
      - traefik.http.services.cargo.loadbalancer.server.port=8080

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: ${CARGO_DB_PASSWORD}
      POSTGRES_DB: cargo
    volumes:
      - cargo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - cargo-proxy

networks:
  cargo-proxy:
    name: cargo-proxy

volumes:
  cargo-db:
  cargo-data:
  cargo-acme:
