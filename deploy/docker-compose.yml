# Cargo stack — exactly three platform containers (NFR-3): Traefik (the
# only container publishing host ports), the controlplane, and Postgres.
# Configuration comes from a mode-0600 .env file next to this compose
# file (generated by install.sh).
#
# This base file runs anywhere without DNS or certificates (localhost /
# bare server IP): the platform is served on plain HTTP (port 80) and on
# HTTPS with Traefik's self-signed default certificate (port 443); apps
# are served on the websecure entrypoint with the same default cert.
# For a real domain with Let's Encrypt certificates, add an overlay:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml    (per-domain HTTP-01)
#   docker compose -f docker-compose.yml -f docker-compose.dns01.yml  (wildcard DNS-01)
# install.sh picks automatically based on your answers.
#
# Required .env keys:
#   CARGO_PLATFORM_DOMAIN   e.g. cargo.example.com, or an IP/localhost for local installs
#   CARGO_MASTER_KEY        64 hex chars (back this up! env vars are unrecoverable without it)
#   CARGO_DB_PASSWORD       Postgres password
# TLS overlays additionally use:
#   CARGO_ACME_EMAIL        Let's Encrypt account email (tls + dns01)
#   CARGO_APPS_SUFFIX       e.g. apps.example.com (dns01 wildcard cert)
#   CARGO_DNS_PROVIDER      Traefik provider name, e.g. cloudflare (dns01)
#   plus the provider's own credential env vars (e.g. CF_DNS_API_TOKEN),
#   forwarded below via traefik's environment.

name: cargo

services:
  traefik:
    # v3.6+: Docker Engine 29 dropped API <1.44, which breaks v3.3's
    # docker provider (empty "Error response from daemon" on startup).
    image: traefik:v3.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=cargo-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # TLS on websecure with no resolver: Traefik's self-signed default
      # certificate. App routers (generated websecure+tls=true) work as-is.
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addServicesLabels=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - cargo-acme:/acme
    networks:
      - cargo-proxy

  controlplane:
    image: ghcr.io/bograh/cargo:latest
    # install.sh runs from a checkout, so compose builds the image locally
    # when the registry copy is unavailable (e.g. private GHCR package).
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CARGO_DATABASE_URL: postgres://cargo:${CARGO_DB_PASSWORD}@db:5432/cargo
      CARGO_MASTER_KEY: ${CARGO_MASTER_KEY}
      CARGO_HTTP_ADDR: ":8080"
      CARGO_DATA_DIR: /var/lib/cargo
      CARGO_ENV: production
      # Optional instance-wide default container caps for tenant apps (each app
      # can override in its Settings). Defaults shown; uncomment to change.
      # CARGO_DEFAULT_MEM_LIMIT: "512m"
      # CARGO_DEFAULT_CPU_LIMIT: "1"
      # CARGO_DEFAULT_PIDS_LIMIT: "512"
      # Control-plane backups (written to <dataDir>/platform-backups). Default
      # keeps the last 14 daily dumps.
      # CARGO_PLATFORM_BACKUP_KEEP: "14"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cargo-data:/var/lib/cargo
    networks:
      # cargo-proxy: routed by Traefik and used to reach app containers for
      # health probes. cargo-system: private link to the platform DB (below).
      - cargo-proxy
      - cargo-system
    labels:
      # The platform UI is routed through Traefik like any app (dogfooded).
      # No tls/certresolver here: plain HTTP on web, default cert on
      # websecure. The TLS overlays override these labels wholesale.
      - traefik.enable=true
      - traefik.http.routers.cargo.rule=Host(`${CARGO_PLATFORM_DOMAIN}`) || Host(`localhost`) || Host(`127.0.0.1`)
      - traefik.http.routers.cargo.entrypoints=web,websecure
      - traefik.http.services.cargo.loadbalancer.server.port=8080

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: ${CARGO_DB_PASSWORD}
      POSTGRES_DB: cargo
    volumes:
      - cargo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      # The platform DB is reachable ONLY over cargo-system — never from
      # cargo-proxy, which tenant app containers join. This keeps a deployed
      # user app from opening a socket to the control-plane database.
      - cargo-system

networks:
  cargo-proxy:
    # Shared with app containers (app compose files consume it as external,
    # and the controlplane creates it on first deploy). External here too so
    # `docker compose down` never removes it from under running apps, and a
    # pre-existing unlabeled network (created by the controlplane) is reused.
    # install.sh ensures it exists before `up`.
    name: cargo-proxy
    external: true
  cargo-system:
    # Private controlplane<->DB link. Compose-managed (not external): only the
    # platform stack's own services use it, never dynamically-created app
    # containers, so it needs no external lifecycle. internal:true denies the
    # DB any route off this network (no gateway / no outbound).
    internal: true

volumes:
  cargo-db:
  cargo-data:
  cargo-acme:
